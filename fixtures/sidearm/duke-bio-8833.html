:491,"url":12,"userName":12},{"icon":493,"oldIcon":494,"platformName":495,"url":12,"userName":12},{"Twitter":12,"Instagram":1220,"Facebook":12,"YouTube":12,"Snapchat":12,"TikTok":12,"Cameo":12,"Twitch":12,"LinkedIn":12,"Shop":12,"INFLCR":12},{"userName":1203,"url":1209},"2026-08-15T14:53:29.403",[1223,1253,1278,1303],{"id":1224,"title":1225,"firstName":1226,"lastName":1227,"image":1228,"sport":1233,"positionShort":-1,"call_to_action":-1,"bio":1234,"twitter":18,"images":12,"displayFields":1235,"latestBioId":1224,"email":1239,"phone":18,"url":12,"staffId":1240,"socialMediaR":1241,"custom1":18,"custom2":18,"custom3":18,"custom4":18},5346,"Head Coach","Kieran","Hall",{"altText":1229,"url":1230,"absoluteUrl":1231,"creditName":1232,"mediaCaption":12,"title":1229},"Kieran Hall","\u002Fimages\u002F2023\u002F8\u002F7\u002FKieran-HS-GD.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F8\u002F7\u002FKieran-HS-GD.jpg","Duke Athletics",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"One of the top minds in the game, Kieran Hall enters his second season as the Duke women's soccer program's head coach in 2026. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall turned in an impressive debut, leading Duke to the NCAA College Cup, a 17-5-1 overall ledger and 7-3-0 ACC mark in his first season as head coach.  He became just the third first-year head coach to lead their squad to the NCAA College Cup.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke featured a pair of All-America selections in 2025 as Kat Rader and Mia Minestrella earned honors, while three Blue Devils signed professional contracts in the NWSL -- Rader (Houston), Carina Lageyre (Angel City FC) and Devin Lynch (Denver Summit FC).  Duke will now feature 11 Blue Devils competing in the NWSL in 2026 and Hall has coached all of those alumnae for at least one season.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOn July 22, 2024, Duke Vice President & Director of Athletics Nina King announced Hall will be the third Blue Devil women's soccer head coach beginning in 2025, following the retirement of the previous head coach Robbie Church. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall joined the Blue Devils as an assistant coach in 2019, before being elevated to associate head coach in June of 2020. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOver his first seven years with the women's soccer program, Hall has helped lead Duke to six NCAA Tournament selections, including NCAA College Cup appearances in 2024 and 2025.  The Blue Devils have totaled five double-digit win seasons, including 18 in 2024 and 17 in 2025, and were the No. 1 overall seed in the NCAA Tournament for the first time in 2024.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall has ignited Duke's offense the last two seasons, registering 123 goals scored, which ranks third nationally.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke has collected 74 shutouts on the defensive end, averaged 2.1 goals per game, had 18 All-ACC selections and eight All-America honorees under Hall's time with the Blue Devils. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2025, Hall guided Duke to a 17-5-1 ledger and was ranked No. 1 early in the season as the Blue Devils opened the year with five wins in a row, including top 15 victories over Penn State and Arkansas.  Duke went on to win 11 out of its final 13 contests, earned a No. 2 overall seed in the NCAA Tournament and outscored opponents 9-1 in five NCAA Tournament matches.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe 2025 campaign was impressive for Hall and the Blue Devils as Duke featured a roster with five freshmen seeing significant minutes and a sophomore goalkeeper starting all but one match.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall and the Blue Devils claimed just the fourth ACC Regular Season title in 2024 with a perfect, 9-0-1 ledger.  Duke also posted 12 clean sheets as a team as well featuring one of the top defenses nationally all season. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall helped lead Duke to a record-breaking year in 2024 with school records in points (215), goals (68), and assists (79).  A total of 14 Blue Devils registered at least one goal on the season, while 12 Duke players collected multi-goals on the year.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke's student-athletes garnered numerous big-time honors in 2024 as Maggie Graham, Hannah Bebar, Cameron Roller, and Leah Freeman earned All-America and Academic All-America accolades.  Graham received ACC Midfielder of the Year honors, Roller was tabbed ACC Defensive Player of the Year and Freeman was voted ACC Goalkeeper of the Year.  For the second time over the last three years, Duke featured a finalist for the MAC Hermann Trophy as Graham earned honors. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nFor the outstanding season in 2024, Hall and the Blue Devil coaching staff were tabbed the United Soccer Coaches Atlantic Region Staff of the Year.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall enters his seventh overall season with the Blue Devil women's soccer program. He helped guide Duke to three-straight NCAA Tournament quarterfinal appearances in 2022, 2021, and 2020.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke made its 25th NCAA Tournament appearance in Hall's first campaign, marking the program's fifth-straight showing in the Big Dance. In his increased role in 2020-21, Hall helped the Blue Devils navigate a season affected by the COVID-19 pandemic and was a key factor in Duke advancing to the NCAA Quarterfinals.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe Blue Devils recorded 12 clean sheets in 2020-21 with eight coming as shutout victories -- both ranked second in the ACC. Duke held several ranked opponents to zero goals through 90 minutes or more, including a 1-0 win over No. 3 Clemson, a 0-0 draw versus No. 14 Vanderbilt, and a 0-0, penalty kick loss to top-seeded Florida State in the NCAA Quarterfinals.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe Blue Devils amassed nine shutouts in Hall's first season, with four of those coming against top 25 opponents and three against top 15 foes. Duke's nine wins came by an average margin of three goals, as the team scored four or more goals on five occasions.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn his short time with the Duke women's program, Hall has aided in the development of Sophie Jones, who earned All-ACC honors in her freshman (2019), sophomore (2020), junior (2021), and senior (2022) campaigns, while totaling All-America seasons in 2020-21 and 2022. He has also worked with All-ACC performers Delaney Graham and Taylor Mitchell, MAC Hermann Trophy winner Michelle Cooper, ACC Freshman of the Year and MAC Hermann Trophy semifinalist Kat Rader, MAC Hermann Trophy finalist Maggie Graham, All-American Leah Freeman, All-American Cameron Roller, All-American Hannah Bebar and All-American Mia Minestrella. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nSince joining the women's soccer staff, eight Blue Devils have gone on to be selected in the NWSL Draft, including two first-round selections.  Maggie Graham (Houston Dash), Ella Hase (Racing Louisville FC) and Mary Long (Kansas City Current) also signed professional contracts in the NWSL in 2025, while Rader, Lageyre and Lynch signed in 2026.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall joined the Duke women's soccer program after spending three seasons on the Duke men’s soccer staff. In his three years, Hall helped Duke tally a 31-19-7 record, including a 24-11-5 showing over his last two seasons. Hall was an instrumental part in helping the Blue Devils earn a pair of NCAA Tournament appearances, as the program captured the No. 6 national seed in 2017-18 and reach the Round of 16 in both showings. The No. 6 seed marked the first time the men’s soccer program had earned a national seed since the 2009 season.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn Hall’s second season, the Blue Devils reeled off 13 victories, the most since winning 14 in 2009. The six-game improvement from the 2016 campaign matched the best one-year turnaround in program history. Hall helped Duke to 11 victories in its most recent campaign, giving the Blue Devils back-to-back 10-plus win seasons in seven years.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIndividually, Hall helped Duke produce a pair of United Soccer Coaches All-Americans and 10 All-ACC selections. Most recently, Hall and the Blue Devils produced five all-conference honorees, the most by the program since producing five in 2000. Headlining the group of five was All-ACC First Team selection Daniele Proch and 2018 ACC Rookie of the Year Issa Rayyan. Proch also earned United Soccer Coaches Scholar All-America and Google Cloud CoSIDA Academic All-America honors.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nBefore joining the Duke men’s soccer staff in August 2016, Hall served as an assistant coach and consultant for the Indy Eleven of the NASL and as the Director of Operations at the University of Denver for a season.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nWhile in Indianapolis, the Fort Lewis College product worked with the club in a consulting capacity in preparation for the 2016 NASL season. Before his stint with the Eleven, Hall assisted the Denver Pioneer program with the design and periodization of training schedules and exercises.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall, before moving to Denver, was an assistant coordinator and scout for Levante UD of La Liga in Spain. He was the assistant coordinator of U13-U16 teams at the Spanish football academy. He also served as an opposition scout for Atl&eacute;tico Levante UD, the club’s professional B team, and U13-U16 age groups.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nA four-year starter at Fort Lewis College, Hall helped lead the Skyhawks to the 2005 NCAA Division II National Championship and the 2006 NCAA runner-up. He served as a team captain and was an all-conference and all-region selection during his time at Fort Lewis.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall’s international experience includes being a starting center midfielder for Great Britain’s U-23 team which advanced to the semifinals at the World University Games in Serbia. He also was a member of the team for the event in Thailand in 2007.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHall holds a U.S. Soccer Senior A license and UEFA B license and earned a Master’s in Football Management from Universidad Europea de Madrid.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>The Hall File\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPERSONAL\u003C\u002Fstrong>\u003Cbr \u002F>\r\nFull Name:  Kieran Hall\u003Cbr \u002F>\r\nPlace of Birth:  Blackburn, England\u003Cbr \u002F>\r\nFamily:  Wife, Dr. Emily Hall, Duke Department of Anesthesia\u003Cbr \u002F>\r\n    \u003Cbr \u002F>\r\n\u003Cstrong>EDUCATION\u003C\u002Fstrong>\u003Cbr \u002F>\r\nCollege:  Fort Lewis College, 2008\u003Cbr \u002F>\r\n    Degree in Business Administration\u003Cbr \u002F>\r\n    Master's in Football Management from Universidad Europea de Madrid\u003Cbr \u002F>\r\nHigh School:  Queen's Park High School\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>PLAYING EXPERIENCE\u003C\u002Fstrong>\u003Cbr \u002F>\r\nFort Lewis College:  2004-07\u003Cbr \u002F>\r\n    Played under now Stanford Head Coach and three-time NCAA DI National Champion, Jeremy Gunn)\u003Cbr \u002F>\r\n    Represented Great Britain U-23s at two World University Games (Bangkok 2007, Belgrade 2009)\u003Cbr \u002F>\r\n    Drafted by Houston Dynamo\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>COLLEGE HONORS\u003C\u002Fstrong>\u003Cbr \u002F>\r\n2005 NCAA DII National Champion, 2006 NCAA DII National Runner-Up\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>COACHING EXPERIENCE\u003C\u002Fstrong>\u003Cbr \u002F>\r\nWomen’s Head Coach:  Duke (2025-present)\u003Cbr \u002F>\r\nWomen's Associate Head Coach:  Duke (2020-24)\u003Cbr \u002F>\r\nWomen's Assistant Coach:  Duke (2019-20)\u003Cbr \u002F>\r\nMen's Soccer Assistant Coach:  Duke (2016-18)\u003Cbr \u002F>\r\nDirector of Operations\u002FAssistant Coach:  Denver (2015-16)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nU-16 Academy Coach:  Levante UD (La Liga - 2014-15)\u003Cbr \u002F>\r\nAssistant Coach:  Fort Lewis College (2013-14)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Other Affiliations\u003C\u002Fstrong>\u003Cbr \u002F>\r\nU.S. Soccer Senior A and UEFA B Licensed Coach\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>COACHING HONORS\u003C\u002Fstrong>\u003Cbr \u002F>\r\n2025 United Soccer Coaches Regional Staff of the Year\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n ",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"Title","Email","Phone","wsoccer@duke.edu",42,[1242,1243,1244,1245,1246,1247,1248,1249,1250,1251,1252],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1254,"title":1255,"firstName":1256,"lastName":1257,"image":1258,"sport":1262,"positionShort":-1,"call_to_action":-1,"bio":1263,"twitter":18,"images":12,"displayFields":1264,"latestBioId":1254,"email":1239,"phone":18,"url":12,"staffId":1265,"socialMediaR":1266,"custom1":18,"custom2":18,"custom3":18,"custom4":18},5347,"Associate Head Coach","Carla","Overbeck",{"altText":1259,"url":1260,"absoluteUrl":1261,"creditName":1232,"mediaCaption":12,"title":1259},"Carla Overbeck","\u002Fimages\u002F2025\u002F7\u002F28\u002FOverbeck-Carla-Associate-Head-Coach.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2025\u002F7\u002F28\u002FOverbeck-Carla-Associate-Head-Coach.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"In her collegiate coaching debut, Carla Overbeck made an immediate impact on the Duke University women’s soccer program, helping the 1992 Blue Devils advance to the NCAA title game. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOver the last 34 years, she has continued her work with the Blue Devils as Duke has advanced to the NCAA Tournament 30 times, including NCAA College Cup appearances in 1992, 2011, 2015, 2017, 2024 and 2025.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverbeck was elevated to associate head coach beginning in 2025 as head coach Kieran Hall entered his first season leading the Blue Devils.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuring her 34 seasons with the Blue Devils, Overbeck has coached 22 All-America selections, 65 All-ACC honorees and eight Missouri Athletic Club (MAC) Hermann Trophy honorees.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nMichelle Cooper was honored in 2022 with the Hermann Trophy, becoming the first Blue Devil to hoist the national player of the year honor in program history.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOne of the top defenders to lace up her cleats in world history, Overbeck has brought that knowledge to the pitch with the Blue Devils, helping lead Duke to 327 shutouts over those 34 seasons.  Since the ACC began awarding the ACC Defensive Player of the Year, five Duke players have earned the honor -- Carolyn Ford (2005), Natasha Anasi (2011), Christina Gibbons (2016), Schuyler DeBree (2017) and Cameron Roller (2024).  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverbeck and the Blue Devils became just the 12th program in NCAA history to make back-to-back NCAA College Cup appearances in 2025 as Duke advanced to the semifinals with a 17-5-1 ledger.  The Blue Devils tallied 12 shutouts on the year with a youthful backline and goalkeeper with the help of Overbeck's tutelage.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2024, Overbeck and the Blue Devils claimed just the fourth ACC regular season title in program lore with a 9-0-1 ledger and went on to advance to the NCAA College Cup for the fifth time in program history.  For the first time Duke received the No. 1 overall seed in the NCAA Tournament.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke tallied 12 shutouts along the way, including zero goals allowed in the first four matches of the NCAA Tournament.  For their efforts, the Duke staff was selected the United Soccer Coaches Atlantic Region Staff of the Year.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke advanced to three-straight NCAA Tournament quarterfinals in 2020, 2021 and 2022, which was also a first for the Blue Devils.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverbeck’s work with the Blue Devils helped them capture the 2017 ACC regular season championship, their third such honor in program history. Behind a school record of 23 wins and a perfect 10-0-0 record in conference play, Duke secured the honor and then captured a No. 1 seed in the NCAA Tournament for the second time in school history, eventually advancing to its second NCAA College Cup in the last three years. For their success, Overbeck and the entire Blue Devil staff were named the United Soccer Coaches National Staff of the Year, becoming the first DWS staff to receive the honor.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverbeck and the Blue Devils captured the first ACC regular season championship in 1994 with a 5-0-1 ledger and then totaled an 8-1-1 mark in 2011 to claim the second title.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nSince 1996, Overbeck has seen 25 Blue Devils go on to be drafted professionally, including five first round selections -- Christina Gibbons (2017), Quinn (2018), Imani Dorsey (2018), Caitlin Cosme (2022) and Michelle Cooper (2022).  Six Duke standouts also signed professional contracts in 2025 and 2026 as well with Maggie Graham (Houston), Ella Hase (Racing Louisville), Mary Long (Kansas City), Kat Rader (Houston), Carina Lageyre (Angel City FC) and Devin Lynch (Denver Summit FC) inking deals.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nA three-time All-America selection at the University of North Carolina, Overbeck was a member of four unbeaten Tar Heel national title squads from 1986-89. North Carolina posted a phenomenal 95-match unbeaten streak (89-0-6) during her career.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverbeck was a four-time member of the NCAA All-Tournament Team and a two-time All-ACC selection. In addition, she was a member of the 1986 Soccer America All-America Freshman Team and was the Most Valuable Defensive Player of the 1988 NCAA Tournament.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverbeck’s playing accomplishments include competing for the United States National Team. Overbeck was an instrumental player for the U.S. in winning the 1991 Women’s World Cup in China. She captained the 1995 U.S. World Cup squad that advanced to the semifinals and also served as captain of the 1996 U.S. Olympic Team that won the gold medal.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 1998, Overbeck competed on the gold-medal-winning Goodwill Games squad. She again captained Team USA to the 1999 World Cup Championship and a silver medal in the 2000 Olympic Games in Sydney, Australia.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn August of 2022, U.S. Soccer unveiled The Carla Overbeck Leadership Award, which will be presented each year to an individual who demonstrates a unique ability to lead and guide others and who contributes to the success of an initiative that benefits those outside their organization and places emphasis on collaboration within and among leadership.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOn May 6, 2006, Overbeck was elected to the National Soccer Hall of Fame and was a 2010 North Carolina Sports Hall of Fame inductee. She was inducted into the Texas Sports Hall of Fame in 2025 as well.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverbeck, who graduated from North Carolina with a degree in psychology in 1990, attended Richardson High School in Richardson, Texas. She and her husband, Greg, have one son, Jackson, and a daughter, Carson Elizabeth.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>OVERBECK’S CAREER HONORS\u003C\u002Fstrong>\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- FIFA World Cup Champion (1991, 1999)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- Olympic Gold Medalist (1996)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- Olympic Silver Medalist (2000)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- Goodwill Games Gold Medalist (1998)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- US Women’s National Team Member (1988-2000)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- US Women’s National Team Captain (1993-2000)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- Sports Illustrated Sportswomen of the Year (1999)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- WUSA Founders Cup II Champion (2002)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- National Soccer Sports HOF Inductee (2006)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- North Carolina Sports HOF Inductee (2010)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- NCAA National Champion (1986-1989)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- Soccer America Freshman All-America (1986)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n- NCAA Tournament Most Valuable Defensive Player (1988)\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n ",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},321,[1267,1268,1269,1270,1271,1272,1273,1274,1275,1276,1277],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1279,"title":1280,"firstName":1281,"lastName":1282,"image":1283,"sport":1287,"positionShort":-1,"call_to_action":-1,"bio":1288,"twitter":18,"images":12,"displayFields":1289,"latestBioId":1279,"email":1239,"phone":18,"url":12,"staffId":1290,"socialMediaR":1291,"custom1":18,"custom2":18,"custom3":18,"custom4":18},5348,"Assistant Coach","Hanna ","Gardner",{"altText":1284,"url":1285,"absoluteUrl":1286,"creditName":1232,"mediaCaption":12,"title":1284},"Hanna Gardner","\u002Fimages\u002F2025\u002F4\u002F24\u002FHannaGardner_Duke1-HS-GD.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2025\u002F4\u002F24\u002FHannaGardner_Duke1-HS-GD.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Hanna Gardner enters her second season on the Blue Devil staff as an assistant coach.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nA native of Chapel Hill, N.C., Gardner joined the Blue Devils in January of 2025, after two seasons as an assistant coach at Alabama.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nGardner made an immediate impact in her first season at Duke helping lead the Blue Devils to a 17-5-1 ledger, an appearance in the NCAA College Cup and a No. 2 seed in the NCAA Tournament.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nAs a team, Duke scored 55 goals and registered 12 shutouts, while registering six wins over ranked opponents.  Four different Blue Devils earned All-ACC accolades  -- Kat Rader, Mia Minestrella, Carina Lageyre and Cameron Roller -- along with both Rader and Minestrella receiving All-America accolades.  Rader went on to be named a MAC Hermann Trophy semifinalist.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThree different Duke graduates went on to sign professional contracts in the NWSL with Rader signing with Houston, Lageyre with Angel City FC and Devin Lynch with Denver Summit FC.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPrior to arriving in Durham, Gardner helped lead Alabama to 22 victories and one trip to the NCAA Tournament second round.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nBefore her time with the Crimson Tide, she was a High Performance Coach at the Charleston Battery and the Kansas City Current for back-to-back seasons.  Gardner also spent time at North Carolina FC as a Youth Head Coach for the North Carolina Olympic Development Program.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPrior to joining North Carolina FC, Gardner spent three years with Carolina Leadership Academy.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nGardner was a tremendous leader, four-year starter and captain at North Carolina from 2012-16.  She scored the winning goal in the 2012 NCAA Championship match and also led UNC to the 2016 NCAA College Cup.  A walk-on as a freshman, Gardner started the final 22 matches on defense and helped the Tar Heels to 10 shutouts and the NCAA title.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nStarting 74-of-91 career matches, Gardner totaled three goals at North Carolina.  She guided UNC to 81 team wins over five seasons and five NCAA Tournament appearances.  On the defensive side, Gardner helped her squads combine for 56 shutouts.  She was a member of the U.S. U-20 National Team from 2013-15 during her time with the Tar Heels.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n    ",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},1329,[1292,1293,1294,1295,1296,1297,1298,1299,1300,1301,1302],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1304,"title":1280,"firstName":1305,"lastName":1306,"image":1307,"sport":1311,"positionShort":-1,"call_to_action":-1,"bio":1312,"twitter":18,"images":12,"displayFields":1313,"latestBioId":1304,"email":1239,"phone":18,"url":12,"staffId":1314,"socialMediaR":1315,"custom1":18,"custom2":18,"custom3":18,"custom4":18},5349,"Evan","Gaffney",{"altText":1308,"url":1309,"absoluteUrl":1310,"creditName":1232,"mediaCaption":12,"title":1308},"Evan Gaffney","\u002Fimages\u002F2025\u002F7\u002F30\u002FGaffney-Evan-HS.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2025\u002F7\u002F30\u002FGaffney-Evan-HS.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Evan Gaffney enters his second season as an assistant coach at Duke and is in charge of the goalkeepers.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nGaffney, a native of Dublin, Ireland, arrived in Durham in 2025 after spending three seasons at East Carolina (ECU\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nGaffney made an immediate impact in his first season at Duke helping lead the Blue Devils to a 17-5-1 ledger, an appearance in the NCAA College Cup and a No. 2 seed in the NCAA Tournament.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOn the pitch as Duke's goalkeeper coach, Gaffney was presented with three goalkeepers who had never started a match in 2025.  He helped lead the unit to 12 shutouts on the season, which ranked tied for the sixth-most in program history.  Sophomore Caroline Dysart started 22 of the 23 contests and concluded the season ranking tied for first in the ACC with 11 clean sheets.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn the NCAA Tournament, Duke was the lone team to not allow a goal over the first four matches and finished the tournament allowing only one tally.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuring the three years with the Pirates, Gaffney and the ECU squad totaled 27 overall wins and 12 league victories, while helping claim ECU’s first conference tournament championship and NCAA Tournament appearance in 2024.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nComing off one of the best seasons in program history in 2024, Gaffney helped the Pirates to a 10-4-7 ledger and to a 1-0 victory over top-seeded Memphis in the American Athletic Conference Championship to send the Pirates to the NCAA Tournament.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHe mentored goalkeeper Maeve English to AAC Tournament Most Outstanding Defensive Player honors, while also earning AAC All-Conference Third Team recognition.  Over the last three years, he helped English finish out her career as the ECU all-time leader in starts, appearances, goalkeeper minutes played and shutouts as well as ranking in the top three in program history in saves, goals against average and save percentage. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPrior to ECU, Gaffney recently served as men's assistant coach and developmental squad head coach at Coker University where he helped lead the Cobras to the South Atlantic Conference Tournament championship and an overall 12-7-2 mark during the 2021 campaign.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn addition to being ranked as high as fourth nationally during the season, Coker produced four All-SAC and all-region performers. Defensively, the Cobras posted five shutouts and surrendered a paltry 1.46 goals against average.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nFollowing a stellar playing career at Truett McConnell (Ga.) University, Gaffney served a part-time role as keeper coach for the women's program at his alma mater in 2020. He was a four-year starter, a two-time All-Appalachian Athletic Conference selection and two-time team captain, while manning the net for the Bears from 2016 to 2019. He helped lead TMU to an AAC Tournament title in 2017, was selected as the defensive player-of-the-year on three occasions and was the newcomer-of-the-year in 2016.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nGaffney earned a bachelor's degree in business administration with a concentration in sport management from Truett McConnell in December of 2020.\u003Cbr \u002F>\r\n ",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},1330,[1316,1317,1318,1319,1320,1321,1322,1323,1324,1325,1326],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},[1328,1356,1384,1411,1434,1460,1487,1514,1541,1568,1595,1620,1647,1671],{"id":1329,"title":1330,"firstName":1331,"lastName":1332,"image":1333,"sport":1338,"positionShort":-1,"call_to_action":-1,"bio":1339,"twitter":18,"images":12,"displayFields":1340,"latestBioId":1329,"email":1341,"phone":18,"url":12,"staffId":1342,"socialMediaR":1343,"custom1":18,"custom2":18,"custom3":18,"custom4":1355},509,"Academic Coordinator\u003Cbr>\u003Cem>W Lacrosse, Track & Field, Volleyball, Wrestling\u003C\u002Fem>","Dan","Bowen",{"altText":1334,"url":1335,"absoluteUrl":1336,"creditName":1337,"mediaCaption":12,"title":1334},"Dan Bowen 2023 head shot","\u002Fimages\u002F2023\u002F12\u002F19\u002Fathletics_duke_headshots_ledonne_20231208-5.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F12\u002F19\u002Fathletics_duke_headshots_ledonne_20231208-5.jpg","Nat LeDonne \u002F Duke Athletics",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Dan Bowen joined Duke Athletics in 2023 as an Academic Coordinator for the Olympic sports programs. In this role, Bowen applies his expertise to the holistic development of student-athletes in the Olympic sports programs, ensuring they balance their academic responsibilities with the demands of competitive sports.\u003C\u002Fp>\r\n\r\n\u003Cp>Before arriving in Durham, N.C., Bowen was an Academic Advisor at the University of Maryland, Baltimore County. There, he managed the academic progress and compliance of over 120 student-athletes from the baseball, cross country, track and field and women’s lacrosse teams. His work involved guiding course selection and providing comprehensive academic guidance to ensure NCAA compliance.\u003C\u002Fp>\r\n\r\n\u003Cp>Earlier in his career, Bowen served as a Graduate Assistant in Academic Affairs at the LSU Academic Center for Student-Athlete Success. In this role, he was involved in academic advising for men’s basketball, women's volleyball, women’s beach volleyball and track and field teams. \u003C\u002Fp>\r\n\r\n\u003Cp>Bowen's commitment to education is also evident from his time as a founding Algebra I, Geometry, and seventh-grade Writing Teacher at the STEM Magnet Academy of Pointe Coupee, as part of his involvement with Teach for America. He has been recognized for his dedication to teaching, including being a 2022 N4A Professional Development Institute Graduate in the New Practitioner Track and a 2018 Teach for America Excellence in Teaching Nominee.\u003C\u002Fp>\r\n\r\n\u003Cp>Bowen is an alumnus of The Ohio State University, earning a Bachelor of Arts in German with a minor in The Legal Foundations Society. He furthered his education at LSU, where he attained a Master of Education in School Counseling.\u003C\u002Fp>\r\n\r\n\u003Cp>\u003Cem>Updated Feb. 20, 2024\u003C\u002Fem>\u003C\u002Fp>\r\n",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"daniel.bowen@duke.edu",1106,[1344,1345,1346,1347,1348,1349,1350,1351,1352,1353,1354],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},"Cross Country, M Golf, W Lacrosse, Rowing, W Soccer, M Tennis, Track & Field, Wrestling",{"id":1357,"title":1358,"firstName":1359,"lastName":1360,"image":1361,"sport":1364,"positionShort":-1,"call_to_action":-1,"bio":1365,"twitter":18,"images":12,"displayFields":1366,"latestBioId":1367,"email":1368,"phone":1369,"url":12,"staffId":1370,"socialMediaR":1371,"custom1":18,"custom2":18,"custom3":18,"custom4":1383},288,"Senior Associate Director of Communications","Lindy","Brown",{"altText":18,"url":1362,"absoluteUrl":1363,"creditName":12,"mediaCaption":12,"title":18},"\u002Fimages\u002F2019\u002F7\u002F17\u002FFLJHUGCTFINOAFT.20050919211727.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2019\u002F7\u002F17\u002FFLJHUGCTFINOAFT.20050919211727.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Lindy Brown joined Duke Athletics in November of 1999 and serves as a Senior Associate Director of Communications. Brown serves as the primary communications contact for women's golf, women's soccer, women's tennis and wrestling. During his tenure at Duke, he has worked with numerous championship-caliber programs and has been part of six NCAA Women's Golf Championships, three NCAA Women's Basketball Final Fours, two NCAA Women's Tennis Final Fours and four NCAA Women's Soccer College Cups. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nBrown has been recognized nationally for his contributions to athletics communications. In 2019, he received the CoSIDA Achievement Award for the University Division and was honored at the organization's annual convention. In recognition of his long service to the game of women's basketball, Brown was presented with the U.S. Basketball Writers Association's Mary Jo Haverbeck Award in 2023 at the NCAA Women's Final Four in Dallas. His publications work has also earned national recognition, as his 2001-02 Duke women's basketball media guide placed second nationally in the CoSIDA publications contest for Division I institutions. His 2006-07 women's basketball media guide finished fifth nationally, while the 2007-08 and 2008-09 editions placed sixth and seventh, respectively.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPrior to joining Duke, Brown served as the sports information director and marketing and promotions coordinator at South Carolina Aiken for three years.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nA native of Raleigh, N.C., Brown earned a Bachelor of Science degree in sport management from Western Carolina University. While at Western Carolina, he worked in the sports information office and completed a marketing and promotions internship with the Catamount baseball program.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cem>Updated June 2026\u003C\u002Fem>",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},472,"lbrown@duke.edu","(919) 684-2664",604,[1372,1373,1374,1375,1376,1377,1378,1379,1380,1381,1382],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},"W Golf, W Soccer, W Tennis, Wrestling",{"id":1385,"title":1386,"firstName":1387,"lastName":1388,"image":1389,"sport":1393,"positionShort":-1,"call_to_action":-1,"bio":1394,"twitter":18,"images":12,"displayFields":1395,"latestBioId":1396,"email":1397,"phone":18,"url":12,"staffId":1398,"socialMediaR":1399,"custom1":18,"custom2":18,"custom3":18,"custom4":18},296,"Assistant Director of Creative Video \u003Cbr>\u003Cem>W Soccer, W Golf, Track & Field, Cross Country, Wrestling\u003C\u002Fem>","Chase ","Crawford",{"altText":1390,"url":1391,"absoluteUrl":1392,"creditName":1232,"mediaCaption":12,"title":1390},"Chase Crawford 2025 headshot","\u002Fimages\u002F2025\u002F8\u002F25\u002Fathletics_duke_headshots_ledonne_20250804-3.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2025\u002F8\u002F25\u002Fathletics_duke_headshots_ledonne_20250804-3.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp dir=\"ltr\">Chase Crawford joined Duke Athletics in March of 2025 and currently serves as a Creative Video Producer. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nBefore joining Duke Athletics, Crawford was a Creative Video Intern for Mississippi State Athletics where he served as the primary creative video contact for the softball team from 2022-2024 and the primary video contact for the women's soccer team during the 2021 season. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nCrawford earned a Bachelors of Arts in Broadcast and Digital Journalism from Mississippi State University in 2024.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cem>Updated July 2026\u003C\u002Fem>\u003Cbr \u002F>\r\n \u003C\u002Fp>\r\n",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},479,"chase.crawford@duke.edu",1362,[1400,1401,1402,1403,1404,1405,1406,1407,1408,1409,1410],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1412,"title":1413,"firstName":1414,"lastName":1415,"image":1416,"sport":1417,"positionShort":-1,"call_to_action":-1,"bio":1418,"twitter":18,"images":12,"displayFields":1419,"latestBioId":1412,"email":1420,"phone":18,"url":12,"staffId":1421,"socialMediaR":1422,"custom1":18,"custom2":18,"custom3":18,"custom4":18},298,"Assistant Director of Game Operations, Championships & Events","Shane","Curry",{"altText":-1,"url":-1,"absoluteUrl":-1,"creditName":12,"mediaCaption":12,"title":-1},{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp data-end=\"521\" data-start=\"229\">Shane Curry joined the Duke Athletics staff in 2025 as Assistant Director of Game Operations, Events & Championships. In this role, he supports the planning and execution of game day operations, campus and championship events and facility management efforts across Duke’s athletic venues.\u003C\u002Fp>\r\n\r\n\u003Cp data-end=\"1159\" data-start=\"523\">Curry brings experience across professional, collegiate and high-profile event operations. He most recently served as a Membership Sales Account Executive with the New York Islanders, where he drove more than $600,000 in revenue through direct sales and client relationship development. He previously held game presentation and operations roles with the New York Jets, Cornell University and at Super Bowl LVI, as well as serving as a game operations intern for Duke Athletics from 2021–22. He played a key role in Duke’s home athletics events and in the planning and execution of Coach K’s retirement celebration in 2022.\u003C\u002Fp>\r\n\r\n\u003Cp data-end=\"1339\" data-start=\"1161\">A native of Stamford, Conn., Curry earned a bachelor’s degree in business administration with a concentration in sport management and sport marketing from Ithaca College in 2022.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cem>Updated on September 3, 2025\u003C\u002Fem>\u003C\u002Fp>\r\n",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"shane.curry@duke.edu",1413,[1423,1424,1425,1426,1427,1428,1429,1430,1431,1432,1433],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1435,"title":1436,"firstName":1437,"lastName":1438,"image":1439,"sport":1443,"positionShort":-1,"call_to_action":-1,"bio":1444,"twitter":18,"images":12,"displayFields":1445,"latestBioId":1435,"email":1446,"phone":18,"url":12,"staffId":1447,"socialMediaR":1448,"custom1":18,"custom2":18,"custom3":18,"custom4":387},510,"Athletic Training Fellow","Brittany","Daley-Berger",{"altText":1440,"url":1441,"absoluteUrl":1442,"creditName":1232,"mediaCaption":12,"title":1440},"Brittany Daley-Berger 2026 head shot","\u002Fimages\u002F2026\u002F7\u002F14\u002F2026_27_DUAA_Headshots_0024.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2026\u002F7\u002F14\u002F2026_27_DUAA_Headshots_0024.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Brittany Daley-Berger, MS, LAT, ATC joined Duke Athletics in 2026 as an Athletic Training Fellow. She provides medical coverage for the Blue Devils' swimming & diving program.\u003C\u002Fp>\r\n\r\n\u003Cp>Prior to joining Duke, Daley-Berger served as the resident athletic trainer for track & field at Virginia Tech. During her athletic training education at Alabama, she completed clinical experiences with women's soccer, baseball, swimming & diving at Shelton State Community College and the USA Baseball Collegiate National Team as a summer athletic training intern.\u003C\u002Fp>\r\n\r\n\u003Cp>Daley-Berger earned a Bachelor of Science in health science from Greensboro College in 2022, where she was a member and captain of the women's soccer team. She went on to earn a Master of Science in athletic training from Alabama in 2024. She is a licensed athletic trainer, a certified athletic trainer and a member of the National Athletic Trainers' Association.\u003C\u002Fp>\r\n\r\n\u003Cp>\u003Cem>Updated July 2026\u003C\u002Fem>\u003C\u002Fp>\r\n",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"brittany.daley@duke.edu",1404,[1449,1450,1451,1452,1453,1454,1455,1456,1457,1458,1459],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1461,"title":1462,"firstName":1463,"lastName":1464,"image":1465,"sport":1469,"positionShort":-1,"call_to_action":-1,"bio":1470,"twitter":18,"images":12,"displayFields":1471,"latestBioId":1472,"email":1473,"phone":18,"url":12,"staffId":1474,"socialMediaR":1475,"custom1":18,"custom2":18,"custom3":18,"custom4":18},292,"Assistant Director of Mental Health and Performance","Dr. Stephanie","Gdovin",{"altText":1466,"url":1467,"absoluteUrl":1468,"creditName":1337,"mediaCaption":12,"title":1466},"Stephanie Gdovin 2025 headshot","\u002Fimages\u002F2025\u002F2\u002F11\u002Fathletics_duke_headshots_ledonne_20250207-36.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2025\u002F2\u002F11\u002Fathletics_duke_headshots_ledonne_20250207-36.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Dr. Stephanie Gdovin started with Duke Athletics in August of 2021 as a postdoctoral fellow in Behavioral Health before transitioning into a her role as Assistant Director of Mental Health & Performance in July of 2022. She was promoted to Director of Mental Health & Performance in January 2026.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nGdovin is currently responsible for providing individual psychological and team consultation services to Duke student athletes and teams. Services include treating mental health issues, as well as college adjustment, relationship concerns, injury rehabilitation, identity, self-esteem, career transition\u002Fretirement, and body image\u002Feating concerns. She develops and delivers programming to student athletes related to mental health and psychological well-being, and serves on the Eating Disorder Integrated Care Team with physicians and dietitians in Athletics providing comprehensive multidisciplinary treatment, consultation and referral services to athletes with eating disorders. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nGdovin is a member of the Diversity, Equity, Inclusion, and Belonging (DEIB) advisory group promoting social justice and DEIB initiatives within the Athletic Department, and is a licensed psychologist in North Carolina and Certified Mental Performance Consultant by the Association for Applied Sport Psychology (AASP). She's active in professional organizations, including AASP and the American Psychological Association (APA) Division of Sport, Exercise, and Performance Psychology (Division 47), and was the 2022 recipient of the APA Division 47 Sport, Exercise, and Performance Psychology Dissertation Award. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPrior to her arrival in Durham, Gdovin completed her Ph.D. in Counseling Psychology with an emphasis in Sport Psychology from the University of North Texas in August of 2021. As a doctoral student, Gdovin provided mental health support and sport psychology services to North Texas student-athletes, and worked in multiple university counseling centers as well as a community mental health clinic that provided individual and group therapy services. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nA native of Plaistow, N.H., Gdovin also holds an M.S. in Kinesiology with a concentration in Sport and Exercise Psychology from the University of North Carolina at Greensboro, where she graduated in 2015. She earned her B.S. in Applied Exercise Science from Springfield College in 2012, where she was a member of the softball team as well.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cem>Updated on January 2, 2026\u003C\u002Fem>\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n ",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},480,"stephanie.gdovin@duke.edu",950,[1476,1477,1478,1479,1480,1481,1482,1483,1484,1485,1486],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1488,"title":1489,"firstName":1490,"lastName":1491,"image":1492,"sport":1496,"positionShort":-1,"call_to_action":-1,"bio":1497,"twitter":18,"images":12,"displayFields":1498,"latestBioId":1499,"email":1500,"phone":18,"url":12,"staffId":1501,"socialMediaR":1502,"custom1":18,"custom2":18,"custom3":18,"custom4":18},291,"Director of Sports Nutrition","Shelby","Johnson",{"altText":1493,"url":1494,"absoluteUrl":1495,"creditName":12,"mediaCaption":12,"title":12},"Shelby Johnson headshot","\u002Fimages\u002F2023\u002F8\u002F24\u002FShelby_Johnson.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F8\u002F24\u002FShelby_Johnson.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Shelby Johnson joined the Duke Athletics staff in July of 2022 as Director of Sports Nutrition. In her role, she helps provide health and performance nutrition related service for Duke student athletes. Johnson earned her Bachelor of Science degree in Dietetics from Lipscomb University as a part of the Class of 2013 and went on to earn her Masters of Science in Applied Physiology and Kinesiology from the University of Florida in 2019.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nJohnson currently resides in Durham with her Yorkshire Terrier, Twirl.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cem>Last updated: 8\u002F25\u002F23\u003C\u002Fem>",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},501,"shelby.johnson@duke.edu",1014,[1503,1504,1505,1506,1507,1508,1509,1510,1511,1512,1513],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1515,"title":1516,"firstName":1517,"lastName":1518,"image":1519,"sport":1523,"positionShort":-1,"call_to_action":-1,"bio":1524,"twitter":18,"images":12,"displayFields":1525,"latestBioId":1515,"email":1526,"phone":1527,"url":12,"staffId":1528,"socialMediaR":1529,"custom1":18,"custom2":18,"custom3":18,"custom4":18},293,"Head of Sports Science, Duke Women's Soccer","Drew","Lukes",{"altText":1520,"url":1521,"absoluteUrl":1522,"creditName":1232,"mediaCaption":12,"title":1520},"Drew Lukes 2026 Head shot","\u002Fimages\u002F2026\u002F7\u002F14\u002F2026_27_DUAA_Headshots_0006.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2026\u002F7\u002F14\u002F2026_27_DUAA_Headshots_0006.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Drew Lukes the Head of Sports Science for the Duke women’s soccer team. He is also a Senior Physical Therapist with Duke Athletics, where he provides comprehensive clinical care to Duke’s Olympic sports programs. He joined the Duke Athletic Medicine staff in 2021 after completing the Duke Division 1 Sports Physical Therapy Fellowship.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPrior to arriving at Duke, Drew completed a Sports Physical Therapy Residency at the University of Wisconsin, developing advanced expertise in the evaluation, treatment, and rehabilitation of high-level athletes. He earned his Doctor of Physical Therapy degree from the University of Minnesota in 2019 and a Master’s degree in Sports Analytics with an emphasis in sports performance from the University of Mississippi in 2025. He holds additional credentials as a Certified Strength and Conditioning Specialist (CSCS), Certified Performance and Sport Scientist (CPSS), and Certified Dry Needling practitioner.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn addition to his sports science and clinical responsibilities, he is actively involved in education and mentorship, serving as a coordinator for the Duke Division I Sports Physical Therapy Fellowship and as Course Director for the Sports Rehabilitation course within the Duke Doctor of Physical Therapy (DPT) program.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDrew has been published in the \u003Cem>Journal of Medicine & Science in Sports & Exercise\u003C\u002Fem> (2020) and continues to pursue clinically applied research initiatives at Duke.",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"drew.lukes@duke.edu","(919) 681-1656",877,[1530,1531,1532,1533,1534,1535,1536,1537,1538,1539,1540],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1542,"title":1543,"firstName":1544,"lastName":1545,"image":1546,"sport":1550,"positionShort":-1,"call_to_action":-1,"bio":1551,"twitter":18,"images":12,"displayFields":1552,"latestBioId":1542,"email":1553,"phone":18,"url":12,"staffId":1554,"socialMediaR":1555,"custom1":18,"custom2":18,"custom3":18,"custom4":1567},295,"Associate Director of Social Media\u003Cbr>\u003Cem>W Soccer, Softball\u003C\u002Fem>","Peter ","Raider",{"altText":1547,"url":1548,"absoluteUrl":1549,"creditName":1232,"mediaCaption":12,"title":1547},"Peter Raider 2025 headshot","\u002Fimages\u002F2025\u002F8\u002F25\u002Fath_duke_headshots_20250727_0003.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2025\u002F8\u002F25\u002Fath_duke_headshots_20250727_0003.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cmeta charset=\"UTF-8\" \u002F>\r\n\u003Cp>Peter Raider joined Duke Athletics in March of 2025 and currently serves as Associate Director of Social Media. In this role, he manages Duke's softball and women's soccer social media accounts, specializing in creating photo and video content.\u003C\u002Fp>\r\n\r\n\u003Cp>Before joining Duke Athletics, Raider was the Creative Video Coordinator for Rutgers football. In this role his focus included creating short and long form content for social platforms, internal use and recruiting purposes. From 2021-2023 he served as the Manager of Creative Media for Ithaca College Athletics, leading and creating content for football, women’s basketball, women’s lacrosse, and baseball.\u003C\u002Fp>\r\n\r\n\u003Cp>Raider earned a Bachelor of Arts in Sports Media from Ithaca College in 2023.\u003C\u002Fp>\r\n",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"peter.raider@duke.edu",1365,[1556,1557,1558,1559,1560,1561,1562,1563,1564,1565,1566],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},"Fencing, Softball, Women's Soccer",{"id":1569,"title":1570,"firstName":1490,"lastName":1571,"image":1572,"sport":1576,"positionShort":-1,"call_to_action":-1,"bio":1577,"twitter":18,"images":12,"displayFields":1578,"latestBioId":1579,"email":1580,"phone":1581,"url":12,"staffId":1582,"socialMediaR":1583,"custom1":18,"custom2":18,"custom3":18,"custom4":18},297,"Sports Marketing Associate","Reich",{"altText":1573,"url":1574,"absoluteUrl":1575,"creditName":1232,"mediaCaption":12,"title":1573},"2023 Shelby Reich head shot","\u002Fimages\u002F2023\u002F9\u002F11\u002Fathletics_duke_headshots_ledonne_20230817-85.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F9\u002F11\u002Fathletics_duke_headshots_ledonne_20230817-85.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Shelby Reich joined the Duke Athletics staff in August 2023 as a Sports Marketing Associate. Before her current position, Reich held the role of Marketing Fan Experience & Sales Coordinator at Wake Forest University. \u003C\u002Fp>\r\n\r\n\u003Cp>A Chapel Hill, N.C., native, Reich is a 2022 graduate of the University of Tennessee, where she earned a degree in marketing. During her undergraduate studies, Reich also worked within the Tennessee athletic department. Her experience was further enriched through experience with the Durham Bulls Baseball Club and the Cincinnati Reds.\u003C\u002Fp>\r\n\u003Cem>Updated Feb. 20, 2024\u003C\u002Fem>",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},489,"shelby.reich@duke.edu","(919) 668-5725",1085,[1584,1585,1586,1587,1588,1589,1590,1591,1592,1593,1594],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1596,"title":1597,"firstName":1598,"lastName":1599,"image":1600,"sport":1603,"positionShort":-1,"call_to_action":-1,"bio":1604,"twitter":18,"images":12,"displayFields":1605,"latestBioId":1596,"email":1606,"phone":18,"url":12,"staffId":1607,"socialMediaR":1608,"custom1":18,"custom2":18,"custom3":18,"custom4":18},287,"Assistant Director of Sports Performance","Megan","Rottler Hattori",{"altText":18,"url":1601,"absoluteUrl":1602,"creditName":12,"mediaCaption":12,"title":12},"\u002Fimages\u002F2023\u002F3\u002F29\u002FMegan_Rottler_Hattori.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F3\u002F29\u002FMegan_Rottler_Hattori.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Megan Rottler Hattori is the Associate Director of Sports Performance for Olympic Sports at Duke University, a position she assumed in 2024 after serving as the Assistant Director of Sports Performance since July 2017. She is the primary sports performance coach for the women’s soccer and volleyball teams.\u003C\u002Fp>\r\n\r\n\u003Cp>Before her tenure at Duke, Rottler Hattori was the Associate Director of Strength and Conditioning at Harvard University. There, she was responsible for the strength and conditioning programs of various sports, including men’s and women’s diving, women’s lacrosse, women’s rugby, softball, women’s volleyball and men’s rowing, and also assisted with the football and women’s basketball programs.\u003C\u002Fp>\r\n\r\n\u003Cp>Her career in sports performance began at Southeast Missouri State University, where she initially worked as a graduate assistant before transitioning to a full-time role.\u003C\u002Fp>\r\n\r\n\u003Cp>Originally from Sainte Genevieve, Mo., Rottler Hattori earned her master's degree in Sports Management from Southeast Missouri State University. She holds certifications from the Collegiate Strength and Conditioning Coaches Association (CSCCa) and the United States Weightlifting Organization (USAW).\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nBesides her coaching responsibilities, Rottler Hattori is a CSCCa-approved mentor and directs Duke’s Sports Performance Coaching Assistantship\u002FInternship Program. She also coordinates the annual Bench 2 Beat Cancer fundraiser, with all proceeds benefiting patients and families of the Duke Cancer Center.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cem>Updated August 5, 2024\u003C\u002Fem>\u003C\u002Fp>\r\n",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"megan.rottler@duke.edu",474,[1609,1610,1611,1612,1613,1614,1615,1616,1617,1618,1619],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1621,"title":1622,"firstName":1623,"lastName":1624,"image":1625,"sport":1629,"positionShort":-1,"call_to_action":-1,"bio":1630,"twitter":18,"images":12,"displayFields":1631,"latestBioId":1632,"email":1633,"phone":1634,"url":12,"staffId":224,"socialMediaR":1635,"custom1":18,"custom2":18,"custom3":18,"custom4":18},285,"Murray Building Director of Operations","Erin","Stephenson",{"altText":1626,"url":1627,"absoluteUrl":1628,"creditName":12,"mediaCaption":12,"title":1626},"Erin Stephenson","\u002Fimages\u002F2008\u002F2\u002F8\u002FXUCDZOTSGWDXYLL.20080208164721.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2008\u002F2\u002F8\u002FXUCDZOTSGWDXYLL.20080208164721.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Erin Stephenson joined the Duke athletics staff in October of 2007 and serves as an Administrative Assistant for the Blue Devil lacrosse and soccer programs.\u003C\u002Fp>\n\u003Cp>A native of Maine, N.Y., Stephenson played both field hockey and lacrosse at Hartwick College before graduating in 2004 with a bachelor of arts degree in history. She went on to earn a master's degree in the same discipline from UNC Greensboro in 2006.\u003Cbr>\u003Cbr>\u003C\u002Fp>",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},272,"ec83@duke.edu","(919) 668-5791",[1636,1637,1638,1639,1640,1641,1642,1643,1644,1645,1646],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1648,"title":1649,"firstName":1650,"lastName":1651,"image":1652,"sport":1653,"positionShort":-1,"call_to_action":-1,"bio":1654,"twitter":18,"images":12,"displayFields":1655,"latestBioId":1648,"email":1656,"phone":1657,"url":12,"staffId":1658,"socialMediaR":1659,"custom1":18,"custom2":18,"custom3":18,"custom4":18},286,"Equipment Operations Manager","Cody","Terrell",{"altText":-1,"url":-1,"absoluteUrl":-1,"creditName":12,"mediaCaption":12,"title":-1},{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Cody Terrell joined Duke Athletics in 2022 as an Equipment Operations Manager. He oversees the maintenance, distribution and inventory of equipment and apparel for women's lacrosse and women's soccer, ensuring their optimal readiness for both practice and competition.\u003C\u002Fp>\r\n\r\n\u003Cp>Prior to Duke, Terrell was the Head Equipment Manager at Stetson University beginning in July 2021. In this role, he managed the equipment needs for 18 Division I sports, overseeing orders and budgets for the entire athletic department. Additionally, he led the day-to-day operations of the Stetson football program and supervised a student staff assisting with equipment across all sports.\u003C\u002Fp>\r\n\r\n\u003Cp>Initially at Stetson, Terrell worked in Facilities and Operations, ensuring the smooth setup and running of facilities on game days. In 2020, he transitioned to Equipment Room Assistant Supervisor, responsible for nine sports and a key player in managing a demanding spring season involving 18 sports concurrently.\u003C\u002Fp>\r\n\r\n\u003Cp>Terrell holds a Bachelor of Science in Sport and Exercise Science from the University of Central Florida and a Master of Science in Sport Management from the University of Florida.\u003C\u002Fp>\r\n\r\n\u003Cp>\u003Cem>Updated March 21, 2024\u003C\u002Fem>\u003C\u002Fp>\r\n",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"cody.terrell@duke.edu","(919) 684-4006",904,[1660,1661,1662,1663,1664,1665,1666,1667,1668,1669,1670],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName":479,"userName":12,"url":12,"icon":477,"oldIcon":478},{"platformName":483,"userName":12,"url":12,"icon":481,"oldIcon":482},{"platformName":487,"userName":12,"url":12,"icon":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},{"id":1672,"title":1673,"firstName":1674,"lastName":1675,"image":1676,"sport":1680,"positionShort":-1,"call_to_action":-1,"bio":1681,"twitter":18,"images":12,"displayFields":1682,"latestBioId":1672,"email":1683,"phone":1684,"url":12,"staffId":1685,"socialMediaR":1686,"custom1":18,"custom2":18,"custom3":18,"custom4":18},508,"Assistant Athletic Trainer","Michael ","Tremblay",{"altText":1677,"url":1678,"absoluteUrl":1679,"creditName":1232,"mediaCaption":12,"title":1677},"Michael Tremblay","\u002Fimages\u002F2026\u002F8\u002F12\u002FTremblay-Mike.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2026\u002F8\u002F12\u002FTremblay-Mike.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Michael Tremblay joined the Duke University Athletic Medicine staff in August 2026 and currently serves as the Assistant Athletic Trainer. In this capacity, he is the athletic trainer for both the women’s soccer and the cheerleading\u002Fspirit squad.\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nOriginally from Somerset, Mass., Tremblay graduated from the University of Massachusetts Amherst in 2013 with a Bachelor of Science degree in Kinesiology. He went on to earn his Master of Science in Athletic Training from the University of North Carolina at Greensboro in 2026. \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\nPrior to joining Duke, Tremblay served as an Athletic Trainer at Princeton from 2019-23 and Brown University from 2016-19.  At Princeton, he worked with women’s soccer, wrestling, men’s heavyweight rowing and women’s tennis over the years.  Tremblay was an intern Athletic Trainer at Brown in 2016-17, before being promoted to Assistant Athletic Trainer from 2017-19.  He worked with a variety of sports including men’s and women’s track and field, equestrian, men’s and women’s tennis, men’s heavyweight rowing, men’s soccer and wrestling.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\n \u003Cbr \u002F>\r\n ",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"michael.tremblay@duke.edu","(919) 668-5626",1487,[1687,1688,1689,1690,1691,1692,1693,1694,1695,1696,1697],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"i
