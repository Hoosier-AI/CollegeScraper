tps:\u002F\u002Fgoduke.com\u002Fimages\u002F2015\u002F8\u002F17\u002FUKGPOAQRJLDTFQE.20150817184941.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Since being named the head coach of the Duke women’s soccer program on July 9, 2001, Robbie Church built the Blue Devils into a national powerhouse, making four NCAA College Cup appearances and capturing three ACC regular season championships over his 24 seasons at the helm.\u003C\u002Fp>\r\n\r\n\u003Cp>Over his 39-year career, which covered both the men’s and women’s game, Church amassed a 494-264-81 (.637) record, while going 396-191-78 (.654) in 31 years as a women’s head coach.\u003C\u002Fp>\r\n\r\n\u003Cp>In his final year at Duke in 2024, he ended on a bang helping lead the Blue Devils to an 18-3-1 overall and 9-0-1 ACC ledger.  Church guided Duke to the NCAA College Cup, the ACC regular season title and the No. 1 overall seed in the NCAA Tournament for the first time in program history.\u003C\u002Fp>\r\n\r\n\u003Ctable align=\"left\" class=\"sidearm-table collapse-on-medium border=\" style=\"margin-bottom:10px;border:1px solid #cccccc; font-size: 11px; margin-right: 20px; width: 308px;\">\r\n\t\u003Cthead>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth colspan=\"3\">\u003Cimg alt=\"Robbie Church\" height=\"170\" src=\"\u002Fimages\u002F2022\u002F10\u002F23\u002FMicrosoftTeams-image__1__7RUls.png\" style=\"vertical-align: baseline; display: inline-block;\" title=\"Wilkins\" width=\"302\" \u002F>\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr style=\"background-color: rgb(1, 33, 105);\">\r\n\t\t\t\u003Ctd>\u003Cspan style=\"color:#FFFFFF;\">\u003Cstrong>The Church File\u003C\u002Fstrong>\u003C\u002Fspan>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">\u003Cstrong>Name:\u003C\u002Fstrong> Robbie Church\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">\u003Cstrong>Hometown:\u003C\u002Fstrong> Greensboro, N.C.\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">\u003Cstrong>Alma Mater:\u003C\u002Fstrong> Pfeiffer College '81\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr style=\"background-color: rgb(195, 195, 195);\">\r\n\t\t\t\u003Ctd colspan=\"3\">\u003Cstrong>Coaching Experience\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Women's Head Coach, Duke (2001-24)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Women's Head Coach, Vanderbilt (1999-2000)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Women's Head Coach, Charlotte (1994-98)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Men's Head Coach, Lynn (1990)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Men's Head Coach, Belmont Abbey (1985-89)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Men's Head Coach, East Carolina (1982-83)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Men's Assistant Coach, Duke (1984)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr style=\"background-color: rgb(195, 195, 195);\">\r\n\t\t\t\u003Ctd colspan=\"3\">\u003Cstrong>Coaching Awards\u003C\u002Fstrong>\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">N.C. Soccer Hall of Fame (2020)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">United Soccer Coaches National Staff of the Year (2017)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">ACC Coach of the Year (2011 & 2017)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Southeast Region Coach of the Year (2011)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Soccer America National Coach of the Year (2011)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">NSCAA\u002FAdidas South Region Coach of the Year (2004)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Conference USA Coach of the Year (1997)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">Carolinas Conference Coach of the Year (1989)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd colspan=\"3\">NAIA National Coach of the Year (1989)\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Ftbody>\r\n\u003C\u002Ftable>\r\n\r\n\u003Cp>Church guided Duke to a record-breaking year in 2024 with school records in points (215), goals (68) and assists (79).  A total of 14 Blue Devils registered at least one goal on the season, while 12 Duke players collected multi-goals on the year.  Duke's defense was one of the best nationally registering 12 clean sheets and the Blue Devils were ranked No. 1 nationally for the final four weeks of the season. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke dominated the ACC awards earning the ACC Midfielder of the Year (Maggie Graham), ACC Defender of the Year (Cameron Roller), ACC Goalkeeper of the Year (Leah Freeman) and Church was named ACC Coach of the Year for the third time.  Four Blue Devils -- Graham, Roller, Freeman and Hannah Bebar -- were tabbed United Soccer Coaches All-Americans along with College Sports Communicators Academic All-Americans. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nBebar, Ella Hase, Graham and Mary Long would end up signing professional contracts in the NWSL for the 2025 campaign.  The coaching staff were recognized for their efforts as the Atlantic Region Staff of the Year as well. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe 2011 and 2017 ACC Coach of the Year concluded his 24th season in Durham in 2024 with a 311-150-67 (.653) record and won 144 matches over his  final 10 seasons, guiding the Blue Devils to NCAA College Cup appearances in three of those years. Church's unparalleled success at Duke over the last 24 years included 21 NCAA Championship appearances, advancing 14 times to the Round of 16 and 12 times to the Quarterfinals, while reaching the College Cup on four occasions -- 2011, 2015, 2017 and 2024.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2022, Church guided Duke to a 15-5-3 ledger and yet another trip to the NCAA Quarterfinals, while facing the toughest schedule in the nation. The Blue Devils collected a 6-2-2 ACC mark and advanced to the semifinals of the ACC Championship.With the appearance in the NCAA Tournament quarterfinals, it marked the ninth trip since 2011, which is the second-most appearances nationally. Sophomore Michelle Cooper rewrote the Duke record book with her school-record 49 points and 19 goals. She went on to become the first Blue Devil to win the MAC Hermann Trophy, before turning professional and becoming the No. 2 overall selection by the Kansas City Current. Rookie Kat Rader came in and made an immediate impact being named the ACC Freshman of the Year and was one of the top freshmen nationally with 12 goals and 29 points. Overall, three Blue Devils were drafted in the NWSL with Delaney Graham and Sophie Jones going in the fourth round.\u003C\u002Fp>\r\n\r\n\u003Cp>Church led the Blue Devils to their third No. 1 seed in the NCAA Championship in 2021, which resulted in the program's eighth quarterfinal appearance since 2011. Only Florida State (nine) has appeared in the final eight more times in that span. Duke concluded the season with a 16-4-1 record, tied for the fifth-most wins in program history, while accumulating seven victories over ranked opponents. The Blue Devils battled a nationally competitive schedule, with non-conference wins over No. 13 Arkansas, No. 19 Washington and No. 10 Stanford. In ACC play, Duke earned its first win over rival North Carolina since 2015, defeating the No. 2-ranked Tar Heels 1-0 on the road, before later topping No. 1 Florida State at Koskinen Stadium by the same score. Duke finished third in the ACC with a 7-2-1 mark, signifying the 10th time under Church that the Blue Devils finished in the top five of the conference standings.\u003C\u002Fp>\r\n\r\n\u003Cp>During the 2021 campaign, he helped Michelle Cooper become the fourth ACC Freshman of the Year in program history and the first since 2012. Graduate student Tess Boade and junior Ruthie Jones were each tapped to the All-ACC First Team, alongside Cooper, for the first time in their career.\u003C\u002Fp>\r\n\r\n\u003Cp>In an unprecedented 2020-21 season that will be remembered for teams navigating the COVID-19 pandemic, Church guided Duke to a 12-5-3 record that featured competitive spring matches for the first time in program history. The Blue Devils went 4-2-2 in conference play in the fall, with two wins over a top-five Clemson team. Duke advanced to the semifinals of the conference tournament in November, and three student-athletes -- Sophie Jones (First Team), Delaney Graham (Third) and Taylor Mitchell (Third) -- earned All-ACC honors. After an elongated winter break, the Blue Devils returned to action in early March, and went on to win five of eight games in the spring campaign, including two one-goal victories in the NCAA Championship for yet another spot in the quarterfinal round.\u003C\u002Fp>\r\n\r\n\u003Cp>Sophie Jones ended the 2020-21 season with a number of individual accolades, including United Soccer Coaches All-America Third Team, TopDrawerSoccer.com Best XI Second Team and All-Atlantic Region First Team honors. After the opening game of the season at Wake Forest in September, Church tapped Ruthie Jones as the starting goalkeeper, and the sophomore from Charlotte, N.C., went on to record 12 clean sheets and a .800 save percentage.\u003C\u002Fp>\r\n\r\n\u003Cp>The 2019 season saw the team post a 9-4-7 record, earning a spot in the NCAA Championship for the fifth straight year. Duke tallied a program record-tying seven ties across the season, including four scoreless draws, which tied for seventh-most in NCAA single-season history.\u003C\u002Fp>\r\n\r\n\u003Cp>In 2018, the Blue Devils accumulated 16 wins, with eight coming in ACC play to finish second in the league, giving Duke a top-three finish for the third consecutive season. The 25 wins Church accumulated in ACC play from 2016-18 mark the best three-year stretch in conference play in program history.\u003C\u002Fp>\r\n\r\n\u003Cp>After a solid showing in one of the toughest leagues in the nation, the Blue Devils advanced to the NCAA Round of 16 for the eighth-straight time. Individually, Kayla McCoy capped her career with a United Soccer Coaches First Team All-America accolade to go along with a United Soccer Coaches First Team Scholar All-America spot. The Lincolnwood, Ill., native also was named a CoSIDA third-team Academic All-American and landed on TopDrawerSoccer Best XI Third Team. Church’s squad also reeled in five All-ACC honors, with McCoy leading the way with first team laurels for the second-straight season, becoming the 11th player in DWS history to receive the honor multiple times in her career. Fellow senior Taylor Racioppi, who was tabbed a United Soccer Coaches Third Team Scholar All-American, and junior Ella Stevens were named All-ACC Second Team, while Delaney Graham and Sydney Simmons were tabbed to the ACC All-Freshman Team. Graham was also added to TopDrawerSoccer’s Freshman Best XI Second Team.\u003C\u002Fp>\r\n\r\n\u003Cp>Headlining Church’s 18th season was the senior class of McCoy, Racioppi, Chelsea Burns and Kat McDonald. Under Church’s guidance, the group of four finished their careers with 68 victories, establishing them as the winningest class in program history. During that four-year stretch, the squad reached a pair of NCAA College Cups, including a national runner-up finish in 2015, while also making an appearance in the NCAA Round of 16 (2018) and Quarterfinals (2016).\u003C\u002Fp>\r\n\r\n\u003Cp>Church orchestrated one of the greatest seasons in school history a year prior in 2017, highlighted by 13 broken school records and the program’s fourth NCAA College Cup appearance\u003C.\u002Fp>\u003C\u002Fp>\r\n\r\n\u003Cp>The Blue Devils amassed a program-record 23 victories in 2017 and went 10-0-0 in conference play en route to claiming the ACC regular season championship for the third time in history.\u003C\u002Fp>\r\n\r\n\u003Cp>Duke’s rewriting of the record book did not stop there, as it also set the school record for shutouts (18), home wins (15), ACC wins (10), ranked victories (9) ACC shutouts (8), and ACC goal differential (+20). Church led Duke to its 23rd NCAA Championship appearance and 14th in the last 15 seasons, while also being awarded the second No. 1 seed in school history, with the other coming in 2011.\u003C\u002Fp>\r\n\r\n\u003Cp>Individually, the Blue Devils produced a school record three United Soccer Coaches All-Americans, as well as a school-best and league-high nine All-ACC stars. Those included ACC Offensive Player of the Year\u002FFirst Team All-American (Imani Dorsey), Midfielder of the Year\u002FFirst Team All-American (Rebecca Quinn), and Defender of the Year\u002FThird Team All-American (Schuyler DeBree).\u003C\u002Fp>\r\n\r\n\u003Cp>The standout season also brought a number of honors for Church, who reeled in the second ACC Coach of the Year honor of his career, making him the sixth coach in conference history to earn the award multiple times. Church and his assistants Erwin van Bennekom, Carla Overbeck, and Lane Davis earned United Soccer Coaches National Staff of the Year honors for the first time in program history as well.\u003C\u002Fp>\r\n\r\n\u003Cp>Domination for the Blue Devils extended beyond the pitch as well, as they recorded a nation-leading four United Soccer Coaches Scholar All-Americans, led by Dorsey, who was named Duke women’s soccer’s first National Scholar-Athlete of the Year. The season was capped with a school record six selections in the 2018 NWSL College Draft, which ties the NWSL record. Quinn, selected third by Washington, became the highest Blue Devil selected in program history. Quinn and Dorsey, who was taken with the fifth overall pick by Sky Blue FC, gave the Blue Devils a pair of top-five picks for the first time in DWS history.\u003C\u002Fp>\r\n\r\n\u003Cp>Even though Church dealt with key injuries to three starters during the 2016 campaign, the Blue Devils advanced to the NCAA Quarterfinals before falling to top-seeded West Virginia on the road, 1-0.\u003C\u002Fp>\r\n\r\n\u003Cp>Returning nine starters in 2015 and welcoming in one of the top recruiting classes in the nation, Church could sense it could be a special season. After knocking off fifth-ranked North Carolina in ACC action, Duke went on a run winning six out of the final 10 matches before dropping a 1-0 decision to Penn State in the national championship. Duke totaled a 14-6-5 overall and 4-3-3 league mark and lead the ACC in shutouts with 14.\u003C\u002Fp>\r\n\r\n\u003Cp>After dealing with the loss of a key senior class and many newcomers on the roster, the Blue Devils struggled in 2014 posting an 8-9-1 overall record and missing the NCAA Championship for the first time since the 2002 campaign. But many of those student-athletes return after gaining great experiences and are motivated to excel in 2015.\u003C\u002Fp>\r\n\r\n\u003Cp>Dealing with season-ending knee injuries to starters Gilda Doria and Cassie Pecht, the Blue Devils posted a 9-9-6 overall record in 2013 but played their best soccer at the end. Duke advanced to the Elite Eight for a school-record third straight year, before falling to top-seeded Virginia Tech.\u003C\u002Fp>\r\n\r\n\u003Cp>In 2012, Duke notched a 15-6-2 overall record and advanced to the NCAA Elite Eight. The Blue Devils registered a school-record 207 points, school-record 77 assists and were only two goals away from matching the single-season mark of 67.\u003C\u002Fp>\r\n\r\n\u003Cp>The Blue Devils totaled one of the best seasons in Duke history in 2011 with a then-school-record 22 victories along with an ACC regular season title (8-1 record), a then-school-record 16 shutouts, and a trip to the NCAA College Cup. Duke registered a 4-1 win over Wake Forest in the semifinals of the NCAA College Cup before falling 1-0 to Stanford in the national championship match. For his efforts, Church was named the Soccer America National Coach of the Year and ACC Coach of the Year.\u003C\u002Fp>\r\n\r\n\u003Cp>In 2010, Duke advanced to the NCAA Championship Round of 16, following upset victories against California and fifth-ranked Florida. The Blue Devils featured a very young lineup that included its top three scorers being freshmen -- Mollie Pathman, Laura Weinberg, and Kaitlyn Kerr. Duke turned in an 11-8-4 overall mark.\u003C\u002Fp>\r\n\r\n\u003Cp>Duke registered an 8-9-4 record during the 2009 campaign and advanced to the NCAA Championship First Round while dealing with numerous injuries all season long. Duke started five freshmen to go along with senior standouts Elisabeth Redmond and KayAnne Gummersall. The two All-ACC selections combined for 14 goals and 16 assists on the year to lead the Blue Devils.\u003C\u002Fp>\r\n\r\n\u003Cp>In 2008, Duke advanced to the NCAA Championship Quarterfinals for the second straight year, while totaling a 15-6-3 overall ledger. Duke scored 54 goals and registered a school record-tying 13 shutouts on the season. In the ACC, Duke finished fifth with a 4-3-3 record.\u003C\u002Fp>\r\n\r\n\u003Cp>Duke’s tandem of Elisabeth Redmond and KayAnne Gummersall teamed together to notch 27 goals, which was the most in school history for two players in a single season.\u003C\u002Fp>\r\n\r\n\u003Cp>In 2007, Duke garnered a 10-6-7 overall and 3-3-4 ACC records. The Blue Devils knocked off 21st-ranked South Carolina, 13th-ranked Georgia, and Indiana on the road to advance to the NCAA Championship quarterfinals before falling to 12th-ranked Notre Dame, 3-2, in South Bend, Ind.\u003C\u002Fp>\r\n\r\n\u003Cp>For the second straight season in 2007, Duke registered eight one-goal contests and a total of seven ties but put it all together when it counted in the NCAA Championship. The Blue Devils were ranked as high as 10th nationally during the season. Junior Lorraine Quinn garnered All-America accolades and then went on to help the United States U-23 National Team claim the Nordic Cup title over the summer.\u003C\u002Fp>\r\n\r\n\u003Cp>The 2006 season was one of close matches as well with the Blue Devils registering eight one-goal games and four ties. One of the major highlights was knocking off third-ranked Florida State on senior day with a 3-1 victory and senior Rebecca Moros earning All-America accolades.\u003C\u002Fp>\r\n\r\n\u003Cp>In 2005, the Blue Devils were ranked as high as sixth in the nation and knocked off top-ranked North Carolina on its home field with a 2-1 victory in Chapel Hill. The win was only the second in school history over the Tar Heels. Senior defender Carolyn Ford went on to be selected as the ACC Defensive Player of the Year as Duke registered 11 shutouts.\u003C\u002Fp>\r\n\r\n\u003Cp>In 2004, the Blue Devils collected a 15-8 overall and 5-4 ACC mark. Church led Duke to an NCAA Championship Round of 16 appearance and the five league victories was the most since 1997. For his efforts, Church was named NSCAA\u002Fadidas South Region Coach of the Year.\u003C\u002Fp>\r\n\r\n\u003Cp>Church, who replaced former head coach Bill Hempen in 2001, is only the second coach in Duke’s 35-year history. Over the past numerous years, Church has brought in 15 top-10 recruiting classes by Soccerbuzz.com and TopDrawerSoccer.com - second in 2014, fourth in 2016 and 2020, fifth in 2017, 2019 and 2022, sixth in 2015, 2023 and 2024, seventh in 2012, ninth in 2018 and 10th in 2013. \u003C\u002Fp>\r\n\r\n\u003Cp>Church earned his 100th career victory as a women’s head coach against Florida International on Sept. 20, 2002, and collected his 200th career victory (men and women) on Sept. 26, 2003, against Davidson. With a 2-1 win over California in the 2010 NCAA Championship, Church posted his 200th win as a women’s head coach.\u003C\u002Fp>\r\n\r\n\u003Cp>In 2003, he guided the Blue Devils to 14 victories, which equaled the most wins for Duke since 1994, and to the second round of the NCAA Championship. Church did all of this with only three seniors, as 16 of 22 letterwinners were underclassmen. The Blue Devils finished with a 4-3 record in the ACC, which tied for third place, and were ranked as high as sixth nationally.\u003C\u002Fp>\r\n\r\n\u003Cp>Before arriving at Duke, Church compiled a 21-19-1 record in two seasons as head coach at Vanderbilt. He led the Commodores to the Southeastern Conference (SEC) Tournament semifinals in each of his two seasons.\u003C\u002Fp>\r\n\r\n\u003Cp>In 1994, Church became the first head coach at UNC Charlotte, a position he held until 1998. While at Charlotte, he guided the 49ers to a 66-30-10 mark in five seasons, including the school’s first NCAA Championship bid in 1998 and three Conference USA titles.\u003C\u002Fp>\r\n\r\n\u003Cp>Church coached men’s college teams at Lynn University (1990), East Carolina (1982-84), and Belmont Abbey (1985-89), where he also served as associate athletic director.  He totaled a 96-65-3 record in eight seasons on the men's side. \u003C\u002Fp>\r\n\r\n\u003Cp>Church began his career as a head coach at East Carolina from 1982-84. In 1984, he was a men’s assistant coach at Duke under John Rennie. After a one-year stint with the Blue Devils, Church accepted the head coach and associate athletic director position at Belmont Abbey.\u003C\u002Fp>\r\n\r\n\u003Cp>Over the next five years, he led the Crusaders to a 69-35-1 record, while graduating 90 percent of his players. Included in that stretch were two Carolinas Conference Championships and an NAIA National Tournament appearance in 1989.\u003C\u002Fp>\r\n\r\n\u003Cp>Church moved on to the College of Boca Raton, now Lynn University, in 1990, leading the men’s team to a 17-4-2 mark. In one season, he guided Boca Raton to the District 25 Championship and the NAIA national finals.\u003C\u002Fp>\r\n\r\n\u003Cp>Throughout his 39 years as a college head coach, Church amassed a record of 494-264-81. He was recognized as the Carolinas Conference and NAIA Coach of the Year in 1989, the NSCAA\u002Fadidas South Region Coach of the Year in 2004, the Conference USA Coach of the Year in 1997, the Soccer America National Coach of the Year in 2011, the Southeast Region Coach of the Year in 2011 and the ACC Coach of the Year in 2011, 2017 and 2024. Following the 2019 season, Church was inducted into the North Carolina Soccer Hall of Fame.\u003C\u002Fp>\r\n\r\n\u003Cp>In addition, Church was the NAIA South Region Coach of the Year in 1988 and 1989. He was also tabbed the NAIA District 26 Coach of the Year in 1988 and NAIA District 25 Coach of the Year in 1990.\u003C\u002Fp>\r\n\r\n\u003Cp>In 1991, Church left the college ranks to become the head men’s and women’s soccer coach at Charlotte Country Day School. In three seasons at the helm of the men’s program, Church compiled a 40-22-9 record, including a state finals appearance in 1993. The women’s program was equally successful during his two seasons as head coach, tallying a 24-7-3 mark and winning the 1992 state championship.\u003C\u002Fp>\r\n\r\n\u003Cp>A four-year starter at Pfeiffer College, Church was his team’s leading scorer and MVP as a senior. He was selected NAIA All-South Region, was an All-Conference performer, and was inducted into the school’s Sports Hall of Fame in 1998. He graduated from Pfeiffer with a bachelor of arts degree in health and physical education in 1981. Church went on to earn his master’s degree in health and physical education from the University of South Carolina in 1985.\u003C\u002Fp>\r\n\r\n\u003Cp>Church and his wife, the former Linda Atkins, have two children, Ashley and Kyle. Ashley is a 2008 graduate of UNC Wilmington and was a four-year letterwinner on the women’s soccer team, Kyle is a 2010 graduate of Charlotte and was a four-year letterwinner on the men’s basketball squad. The Church family resides in Durham.\u003C\u002Fp>\r\n\r\n\u003Ch2>Church's Year-by-Year Records\u003C\u002Fh2>\r\n\r\n\u003Ctable border=\"0\" cellpadding=\"1\" cellspacing=\"1\" class=\"sidearm-table\" style=\"width:100%;\">\r\n\t\u003Cthead>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Cth>\u003Cstrong>Year\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>School\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>Overall\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>ACC\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\t\u003Cth>\u003Cstrong>Notes\u003C\u002Fstrong>\u003C\u002Fth>\r\n\t\t\u003C\u002Ftr>\r\n\t\u003C\u002Fthead>\r\n\t\u003Ctbody>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>1982\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>East Carolina (M)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>7-10-0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>--\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>--\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>1983\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>East Carolina (M)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>3-16-0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>--\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>--\u003C\u002Ftd>\r\n\t\t\u003C\u002Ftr>\r\n\t\t\u003Ctr>\r\n\t\t\t\u003Ctd>1985\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>Belmont Abbey (M)\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>10-10-0\u003C\u002Ftd>\r\n\t\t\t\u003Ctd>--\u003C\u002Ftd>\r\n\t\t\t\u003C con":485,"oldIcon":486},{"platformName":491,"userName":12,"url":12,"icon":489,"oldIcon":490},{"platformName":495,"userName":12,"url":12,"icon":493,"oldIcon":494},"494-264-81","311-150-67",{"id":2548,"title":2549,"firstName":2550,"lastName":2551,"image":2552,"sport":2556,"positionShort":-1,"call_to_action":-1,"bio":2557,"twitter":18,"images":12,"displayFields":2558,"latestBioId":2559,"email":2560,"phone":2561,"url":12,"staffId":2562,"socialMediaR":2563,"custom1":18,"custom2":18,"custom3":18,"custom4":18},1285,"Associate Head Coach ","Billy","Lesesne",{"altText":2553,"url":2554,"absoluteUrl":2555,"creditName":12,"mediaCaption":12,"title":2553},"Billy Lesesne","\u002Fimages\u002F2014\u002F8\u002F22\u002FPINSFXYFTXQEPUC.20140822200802.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2014\u002F8\u002F22\u002FPINSFXYFTXQEPUC.20140822200802.jpg",{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Billy Lesesne begins his 14th season with the Duke women&rsquo;s soccer program and his 11th as associate head coach.&nbsp; Lesesne helped lead the 2011 squad to the&nbsp; NCAA College Cup and was selected the Southeast Region Assistant Coach of the Year. &nbsp;\u003Cbr>&nbsp;&nbsp;&nbsp; &nbsp;\u003Cbr>Lesesne had spent three seasons as assistant coach before being promoted during the summer of 2004.&nbsp; In addition to his coaching duties at Duke, he was a North Carolina ODP state coach and Region III staff coach in 2002-03.\u003Cbr>&nbsp;&nbsp;&nbsp; &nbsp;\u003Cbr>Lesesne came to Duke from Vanderbilt, where he served as current Duke head coach Robbie Church&rsquo;s assistant for one season, guiding the team to the semifinals of the Southeastern Conference Tournament (SEC) in 2000.\u003Cbr>&nbsp;&nbsp;&nbsp; &nbsp;\u003Cbr>Before his two-year stint at Vanderbilt, Lesesne was the head coach of the men&rsquo;s and women&rsquo;s soccer programs at his alma mater, Erskine College, for six years. There he earned several coaching honors, including NSCAA Division II Women&rsquo;s South Region Coach of the Year and Carolina&rsquo;s Virginia Athletic Conference Women&rsquo;s Coach of the Year in 1997, after leading the Lady Fleet to a 15-2-1 record and the conference championship. He also won the Carolina&rsquo;s Virginia Athletic Conference Messick Award for Sportsmanship in 1996, 1997 and 1998, as well as the conference award for highest graduation rates for student-athletes. &nbsp;\u003Cbr>&nbsp;&nbsp;&nbsp; &nbsp;\u003Cbr>Lesesne began his coaching career at Cambridge Academy in Greenwood, S.C., in 1988 before serving as the assistant men&rsquo;s coach at the College of Charleston from 1990-91. He also coached the South Carolina&rsquo;s Boys&rsquo; State Olympic Development Program team from 1990-95 and the Girls&rsquo; State ODP team from 1996-99.\u003Cbr>&nbsp;&nbsp;&nbsp; &nbsp;\u003Cbr>Lesesne enjoyed a successful playing career, playing three years of professional soccer with the Charleston Battery (USISL\u002FA-League) and four years at Erskine College where he was a NAIA All-America his senior year and an NSCAA All-South honoree his last two seasons. He also earned NAIA All-District 6 honors from 1983-86 and was the Jake Todd\u002FErskine College Senior Athlete Award winner for the 1986-87 school year. He graduated from Erskine in 1987 with a bachelor&rsquo;s degree in biology\u002Fnatural science.\u003Cbr>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;\u003Cbr>Lesesne currently resides in Durham with his wife, Katie, and his two daughters Addison (10) and Victoria (9).\u003Cbr>\u003Cbr>",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},1290,"lesesne@duaa.duke.edu","(919) Syracuse.\u003Cbr>\u003Cbr>&nbsp;Ely made an immediate impact with the Blue Devils in 2011 as Duke registered a school-record 16 shutouts and allowed only 13 goals in 27 matches.\u003Cbr>\u003Cbr>&nbsp;During her stint at Syracuse, she coached Eliza Bennett-Hattan, who holds the school record for career saves and shutouts.&nbsp; Last year, Ely coached Brittany Anghel, who earned All-Big East Conference Rookie Team accolades in 2010.&nbsp; \u003Cbr>\u003Cbr>&nbsp;A 2007 graduate of Fairfield University, Ely holds the Stags' career saves per game record (6.0), ranks second in single-season saves (113) and owns the Fairfield standard for most saves in a game (14). She was a three-time Metro Atlantic Athletic Conference (MAAC) All-Academic selection and a four-time MAAC Player of the Week honoree. Ely was named to the MAAC All-Rookie Team her freshman year and helped the team to the 2002 MAAC regular-season title and MAAC Tournament crown in 2005.\u003Cbr>\u003Cbr>&nbsp;She holds a U.S.S.F. \"B\" coaching license and an NSCAA National Goalkeeper License. Ely also serves on the Region I coaching staff, working with the goalkeepers.\u003Cbr>\u003Cbr>&nbsp;Ely attended Parkland High School in Allentown, Pa., where she was the team captain and still holds the school records for shutouts in a season (15) and career (50).\u003Cbr>\u003Cbr>&nbsp;Ely resides in Durham.\u003C\u002Fp>",{"staff_title":1236,"staff_email":1237,"staff_phone":1238,"staff_twitter":-1},"kely@duaa.duke.edu","(919) 668-5788",324,[2589,2590,2591,2592,2593,2594,2595,2596,2597,2598,2599],{"platformName":455,"userName":12,"url":12,"icon":453,"oldIcon":454},{"platformName":459,"userName":12,"url":12,"icon":457,"oldIcon":458},{"platformName":463,"userName":12,"url":12,"icon":461,"oldIcon":462},{"platformName":467,"userName":12,"url":12,"icon":465,"oldIcon":466},{"platformName":471,"userName":12,"url":12,"icon":469,"oldIcon":470},{"platformName":475,"userName":12,"url":12,"icon":473,"oldIcon":474},{"platformName s":2681,"hasWePlayedMoments":122,"historicalFields":2686,"displayFields":2706,"settings":2713,"rankedBioFields":2714,"statsSeasons":2729,"birthDate":12,"socialMedia":2734,"academicYearNumber":205,"lastUpdated":2012},{"mediaCaption":12,"url":1996,"absoluteUrl":1997,"altText":109,"title":109,"creditName":12},{"id":279,"title":108,"shortDisplay":348,"shortName":350,"abbrev":348,"facebookPage":-1,"globalSportGender":201,"globalSportId":246,"globalSportShortName":-1,"globalSportNameSlug":351,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},[2664,2665,2666,2667,2668,2669,2670,2671,2672,2673,2674],{"icon":453,"oldIcon":454,"platformName":455,"url":12,"userName":12},{"icon":457,"oldIcon":458,"platformName":459,"url":12,"userName":12},{"icon":461,"oldIcon":462,"platformName":463,"url":12,"userName":12},{"icon":465,"oldIcon":466,"platformName":467,"url":12,"userName":12},{"icon":469,"oldIcon":470,"platformName":471,"url":12,"userName":12},{"icon":473,"oldIcon":474,"platformName":475,"url":12,"userName":12},{"icon":477,"oldIcon":478,"platformName":479,"url":12,"userName":12},{"icon":481,"oldIcon":482,"platformName":483,"url":12,"userName":12},{"icon":485,"oldIcon":486,"platformName":487,"url":12,"userName":12},{"icon":489,"oldIcon":490,"platformName":491,"url":12,"userName":12},{"icon":493,"oldIcon":494,"platformName":495,"url":12,"userName":12},"\u003Cimg src=\"\u002Fpics32\u002F300\u002FKH\u002FKHRPEIWQUKCVUCC.20120820164142.jpg\" alt=\"\" width=\"300\" height=\"230\" align=\"right\">\r\n\u003Cp>\u003Cstrong>\u003Ca href=\"http:\u002F\u002Fwww.goduke.com\u002Ffls\u002F4200\u002FStats_Career\u002Fsoccer-w\u002F2012\u002Fhistcarr.htm?&SPSID=25945&SPID=2029&DB_OEM_ID=4200\">Career Statistics\u003Cbr>\u003C\u002Fa>\u003C\u002Fstrong>\u003Cbr>\u003Cstrong>Career:\u003C\u002Fstrong> Her five career assists in the NCAA Tournament ranks tied for the second-most in Duke history &hellip; started 85 of 90 games over her career ... posted 12 career assists and five goals &hellip; guided Duke to four NCAA Tournaments, including the national championship game in 2011 &hellip; helped lead the Blue Devils to the ACC regular season title in 2011.\u003Cbr>\u003Cbr>\u003Cstrong>Senior (2012):\u003C\u002Fstrong> Started 20 of 21 games ... registered three assists on the season, including one in the NCAA Tournament &hellip; tallied 1,376 minutes on the year &hellip; one of the senior leaders in the midfield for the Blue Devils &hellip; played 90 or more minutes in three matches &hellip; missed two games early in the season due to an ankle injury.\u003Cbr>\u003Cbr>\u003Cstrong>2012-13 Tennis:\u003C\u002Fstrong> Joined women's tennis team on March 23 &hellip; participated in 14 matches &hellip; compiled a 1-1 overall doubles record &hellip; paired with Marianne Jodoin to defeat Wake Forest&rsquo;s Brigita Bercyte and Andrea Retolaza, 8-4, on March 24.\u003Cbr>\u003Cbr>\u003Cstrong>2012 Summer Action:\u003C\u002Fstrong> Led the Chicago Red Stars of the Women&rsquo;s Professional Soccer League (WPSL) to a runner-up finish in the WPSL Elite League ... her Red Stars squad won the U.S. National Cup tournament with a victory over the New York Athletic Club.\u003Cbr>\u003Cbr>\u003Cstrong>Junior (2011):\u003C\u002Fstrong> Started all 27 games ... named to the NCAA College Cup&rsquo;s All-Tournament Team, after notching two assists in the semifinals against Wake Forest ... CollegeSoccer360.com Primetime Performer, following two assists versus Ohio State in the NCAA Sweet 16 ... a great presence in the midfield and often took corner kicks ... scored two goals, both game-winners, against South Carolina on Aug. 21 and at Clemson on Sept. 25 ... ranked seventh on the team with 27 shots ... tallied six assists on the year to rank third ... played 90 minutes or more five times, including a season-high 110 minutes in a scoreless tie with seventh-ranked Virginia on Sept. 29 ... played 1,866 minutes.\u003Cbr>\u003Cbr>\u003Cstrong>Sophomore (2010):\u003C\u002Fstrong> Named to the Duke Nike Classic All-Tournament team ... saw action in 21 games including 17 starts ... scored in the 2-0 victory over N.C. State ... tallied two assists, one in a win over Francis Marion and the other in a win over ninth-ranked Boston College ... took 14 shots...earned 1,266 minutes of playing time ... dealt with a groin injury for the second half of the season.\u003Cbr>\u003Cbr>\u003Cstrong>Freshman (2009):\u003C\u002Fstrong> Started all 21 matches &hellip; recorded an assist versus Clemson &hellip; scored her first collegiate goal and the game-winner against N.C. State and added an insurance goal to account for her scoring on the season &hellip; named CollegeSoccer360.com Primetime Performer of the Week for her efforts against N.C. State &hellip; played both on defense and in the midfield throughout the year &hellip; finished with 1,820 minutes, second most on the team.\u003Cbr>\u003Cbr>\u003Cstrong>National Team Experience:\u003C\u002Fstrong> Placed in the National Team Pool in the U-15 and U-18 years of her career.\u003Cbr>\u003Cbr>\u003Cstrong>Regional Team Experience:\u003C\u002Fstrong> Played on the ODP Regional Team from 2004-09&hellip; traveled to Brazil, Germany, France, Holland, California and Florida&hellip; played on the ODP Illinois State Team 2003-09.\u003Cbr>\u003Cbr>\u003Cstrong>High School\u002FClub:\u003C\u002Fstrong> 2010 Inductee to the Wall-of-Fame at LFHS for soccer, tennis (individual &amp; doubles) &hellip; rated as the nation&rsquo;s No. 13 college prospect for the class of 2009 by Top Drawer Soccer (Nov., 2008) and No. 26 by ESPN Rise (Oct. 2008) ... 2005-09 Pioneer Press All-Lake Shore All-Decade Soccer Team ... as a senior, named 2009 Honorable Mention Spring Girls&rsquo; Soccer All-America and NSCAA\u002Fadidas All-Regional Team&hellip; all-time leading scorer for LFHS with 62 goals and 37 assists &hellip; led the Scouts to a 2009 regional title and into the Class 3A sectionals &hellip; 2009 Pioneer Press Lake Shore Co-Player of the Year and IHSSCA Player of the Year her senior year ... Chicago Sun-Times All-State, Chicago Sun-Times All-Area First Team and Chicago Red Stars All-State\u002FAll-Academic as a senior &hellip; played club her junior year &hellip;&nbsp; earned NSCAA\u002Fadidas All-America, ESPN Rise All-Area (2008) and&nbsp; placed on the adidas Elite Soccer Program All-Star Team &hellip; a three-time All-State,&nbsp; All-Sectional, All-North Suburban Conference, MVP, Golden Boot and Silver Boot selection ... two-time All-Academic &hellip; twice named to the Pioneer Press North Shore First Team during her freshman and sophomore seasons &hellip; led Eclipse Select to the 2006 National U-15 club title, 2008 U-17 Final, 2010 U-19 Final, two Region II championships and three Illinois State Cup titles ... won four consecutive Illinois State Cups ... a very accomplished tennis player being nationally ranked in singles USTA tennis since age 12 ... four-year letterwinner in tennis playing the No. 1 position in both singles and doubles while gathering numerous honors including All-State, All-Conference and All-Academic accolades ... member of National Honors Society Executive Committee ... Honor Roll student. &nbsp;\u003Cbr>\u003Cbr>\u003Cstrong>Personal:\u003C\u002Fstrong> Full name is Katherine Nicole Lipp ... born November 6, 1990 in Darien, Conn. ... daughter of Roman and Kathy Lipp ... has one brother, Chris (22) at Tulane University, and one sister, Maddie (17) ... her father, Roman, played soccer at Dartmouth (1976-80) ... a 2011 and 2012 ACC Honor Roll selection ... majored in history and pursuing a markets and management certificate.\u003Cstrong>\u003Cbr>\u003Cbr>\u003C\u002Fstrong>\u003C\u002Fp>",{"rp_position_long":2677,"height":1719,"rp_letters":2678,"player_hometown":1726,"player_highschool":2679,"player_previous_school":2680},"Position","Year","High School","Prev
