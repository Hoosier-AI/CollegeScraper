5-3-2-1-1-1" role="option" class="s-select__option-item s-text-regular cursor-pointer py-[4px] px-[24px]" tabindex="-1" aria-selected="false"><!----><span> Stats </span><!----></li><li id="v-0-5-3-2-1-1-2" role="option" class="s-select__option-item s-text-regular cursor-pointer py-[4px] px-[24px]" tabindex="-1" aria-selected="false"><!----><span> Media </span><!----></li><!--]--></ul></div></div><!----></div></div></div><div class="s-tab-panels pt-[36px] pt-[36px]"><div id="v-0-5-3-2-0-panel-0" class="s-tab-item s-tab-item--selected" data-test-id="s-tab-item__root" role="tabpanel" aria-labelledby="v-0-5-3-2-0-tab-0" tabindex="0" value="bio"><!--[--><div><div class="s-text-paragraph-longform text-theme-safe overflow-auto legacy_to_nextgen sidearm_prose"><img src="/pics32/300/KH/KHRPEIWQUKCVUCC.20120820164142.jpg" alt="" width="300" height="230" align="right">
<p><strong><a href="http://www.goduke.com/fls/4200/Stats_Career/soccer-w/2012/histcarr.htm?&SPSID=25945&SPID=2029&DB_OEM_ID=4200">Career Statistics<br></a></strong><br><strong>Career:</strong> Her five career assists in the NCAA Tournament ranks tied for the second-most in Duke history &hellip; started 85 of 90 games over her career ... posted 12 career assists and five goals &hellip; guided Duke to four NCAA Tournaments, including the national championship game in 2011 &hellip; helped lead the Blue Devils to the ACC regular season title in 2011.<br><br><strong>Senior (2012):</strong> Started 20 of 21 games ... registered three assists on the season, including one in the NCAA Tournament &hellip; tallied 1,376 minutes on the year &hellip; one of the senior leaders in the midfield for the Blue Devils &hellip; played 90 or more minutes in three matches &hellip; missed two games early in the season due to an ankle injury.<br><br><strong>2012-13 Tennis:</strong> Joined women's tennis team on March 23 &hellip; participated in 14 matches &hellip; compiled a 1-1 overall doubles record &hellip; paired with Marianne Jodoin to defeat Wake Forest&rsquo;s Brigita Bercyte and Andrea Retolaza, 8-4, on March 24.<br><br><strong>2012 Summer Action:</strong> Led the Chicago Red Stars of the Women&rsquo;s Professional Soccer League (WPSL) to a runner-up finish in the WPSL Elite League ... her Red Stars squad won the U.S. National Cup tournament with a victory over the New York Athletic Club.<br><br><strong>Junior (2011):</strong> Started all 27 games ... named to the NCAA College Cup&rsquo;s All-Tournament Team, after notching two assists in the semifinals against Wake Forest ... CollegeSoccer360.com Primetime Performer, following two assists versus Ohio State in the NCAA Sweet 16 ... a great presence in the midfield and often took corner kicks ... scored two goals, both game-winners, against South Carolina on Aug. 21 and at Clemson on Sept. 25 ... ranked seventh on the team with 27 shots ... tallied six assists on the year to rank third ... played 90 minutes or more five times, including a season-high 110 minutes in a scoreless tie with seventh-ranked Virginia on Sept. 29 ... played 1,866 minutes.<br><br><strong>Sophomore (2010):</strong> Named to the Duke Nike Classic All-Tournament team ... saw action in 21 games including 17 starts ... scored in the 2-0 victory over N.C. State ... tallied two assists, one in a win over Francis Marion and the other in a win over ninth-ranked Boston College ... took 14 shots...earned 1,266 minutes of playing time ... dealt with a groin injury for the second half of the season.<br><br><strong>Freshman (2009):</strong> Started all 21 matches &hellip; recorded an assist versus Clemson &hellip; scored her first collegiate goal and the game-winner against N.C. State and added an insurance goal to account for her scoring on the season &hellip; named CollegeSoccer360.com Primetime Performer of the Week for her efforts against N.C. State &hellip; played both on defense and in the midfield throughout the year &hellip; finished with 1,820 minutes, second most on the team.<br><br><strong>National Team Experience:</strong> Placed in the National Team Pool in the U-15 and U-18 years of her career.<br><br><strong>Regional Team Experience:</strong> Played on the ODP Regional Team from 2004-09&hellip; traveled to Brazil, Germany, France, Holland, California and Florida&hellip; played on the ODP Illinois State Team 2003-09.<br><br><strong>High School/Club:</strong> 2010 Inductee to the Wall-of-Fame at LFHS for soccer, tennis (individual &amp; doubles) &hellip; rated as the nation&rsquo;s No. 13 college prospect for the class of 2009 by Top Drawer Soccer (Nov., 2008) and No. 26 by ESPN Rise (Oct. 2008) ... 2005-09 Pioneer Press All-Lake Shore All-Decade Soccer Team ... as a senior, named 2009 Honorable Mention Spring Girls&rsquo; Soccer All-America and NSCAA/adidas All-Regional Team&hellip; all-time leading scorer for LFHS with 62 goals and 37 assists &hellip; led the Scouts to a 2009 regional title and into the Class 3A sectionals &hellip; 2009 Pioneer Press Lake Shore Co-Player of the Year and IHSSCA Player of the Year her senior year ... Chicago Sun-Times All-State, Chicago Sun-Times All-Area First Team and Chicago Red Stars All-State/All-Academic as a senior &hellip; played club her junior year &hellip;&nbsp; earned NSCAA/adidas All-America, ESPN Rise All-Area (2008) and&nbsp; placed on the adidas Elite Soccer Program All-Star Team &hellip; a three-time All-State,&nbsp; All-Sectional, All-North Suburban Conference, MVP, Golden Boot and Silver Boot selection ... two-time All-Academic &hellip; twice named to the Pioneer Press North Shore First Team during her freshman and sophomore seasons &hellip; led Eclipse Select to the 2006 National U-15 club title, 2008 U-17 Final, 2010 U-19 Final, two Region II championships and three Illinois State Cup titles ... won four consecutive Illinois State Cups ... a very accomplished tennis player being nationally ranked in singles USTA tennis since age 12 ... four-year letterwinner in tennis playing the No. 1 position in both singles and doubles while gathering numerous honors including All-State, All-Conference and All-Academic accolades ... member of National Honors Society Executive Committee ... Honor Roll student. &nbsp;<br><br><strong>Personal:</strong> Full name is Katherine Nicole Lipp ... born November 6, 1990 in Darien, Conn. ... daughter of Roman and Kathy Lipp ... has one brother, Chris (22) at Tulane University, and one sister, Maddie (17) ... her father, Roman, played soccer at Dartmouth (1976-80) ... a 2011 and 2012 ACC Honor Roll selection ... majored in history and pursuing a markets and management certificate.<strong><br><br></strong></p></div><!----><div class="mt-8 grid place-content-center"><div class="s-advert sidearm-ad-state flex flex-row justify-center" aria-label="Interactive Ad" role="group" data-test-id="s-advert__root" styl
