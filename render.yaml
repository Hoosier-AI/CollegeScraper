# Render blueprint: one always-on web service. It serves the stats viewer + API, runs the crawl
# worker, and (SCHEDULER_ENABLED=1) enqueues the hourly / nightly / weekly jobs itself.
services:
  - type: web
    name: plaibook-college-scraper
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COLLEGE_TRIGGER_SECRET
        generateValue: true
      - key: CONTACT_EMAIL
        value: hoosieraisolutions@gmail.com
      - key: COLLEGE_ALLOW_PROD
        value: "1"
      - key: SCHEDULER_ENABLED
        value: "1"
      - key: NCAA_API_BASE
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: "8080"
